CONFIG_RGBLED_WIDGET=y
CONFIG_RGBLED_WIDGET_SHOW_LAYER_COLORS=y

# Layer colors: 0=Black, 1=Red, 2=Green, 3=Yellow, 4=Blue, 5=Magenta, 6=Cyan, 7=White
# 0 mac_default / 1 win_default / 2 scroll_invert: off
CONFIG_RGBLED_WIDGET_LAYER_0_COLOR=0
CONFIG_RGBLED_WIDGET_LAYER_1_COLOR=0
CONFIG_RGBLED_WIDGET_LAYER_2_COLOR=0
# 3 numbers: green
CONFIG_RGBLED_WIDGET_LAYER_3_COLOR=2
# 4 symbols: blue
CONFIG_RGBLED_WIDGET_LAYER_4_COLOR=4
# 5 func_navi: yellow
CONFIG_RGBLED_WIDGET_LAYER_5_COLOR=3
# 6-7 system: white
CONFIG_RGBLED_WIDGET_LAYER_6_COLOR=7
CONFIG_RGBLED_WIDGET_LAYER_7_COLOR=7
